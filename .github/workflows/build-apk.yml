# ============================================================
#  بناء تطبيق أندرويد (APK) من PWA — عبر Bubblewrap (TWA)
#
#  لماذا TWA لا تغليف الكود: الموقع كله صفحات ديناميكية تقرأ قاعدة
#  بيانات واحدة مشتركة، فلا يمكن تحزيمه داخل الهاتف. والتطبيق يبقى
#  واجهةً للسيرفر — وهذا هو الصحيح لنظام محاسبي.
#
#  التشغيل: Actions ← "بناء تطبيق أندرويد (APK)" ← Run workflow
#
#  ⚠ تسلسل إلزامي قبل أول تشغيل:
#    ١) يجب أن يكون الموقع المنشور يعمل (ليقرأ Bubblewrap الـ manifest منه)
#    ٢) بعد أول بناء: خذ بصمة SHA-256 المطبوعة في السجل وضعها في
#       متغيّر البيئة ANDROID_SHA256 عند Render، ثم أعد نشر الموقع
#    ٣) هكذا يتحقّق أندرويد من assetlinks.json ولا يظهر شريط المتصفح
# ============================================================
name: بناء تطبيق أندرويد (APK)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "اسم الإصدار (مثل 1.0.0)"
        required: false
        default: "1.0.0"
      version_code:
        description: "رقم الإصدار (يزيد مع كل رفع للمتجر)"
        required: false
        default: "1"
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: إعداد Java (يحتاجه Bubblewrap)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: تثبيت Bubblewrap
        run: npm install -g @bubblewrap/cli

      # Bubblewrap يسأل أسئلة تفاعلية (تثبيت JDK، تثبيت Android SDK، كلمة السر)
      # ويقرأ الطرفية مباشرة لا مجرى الإدخال، فلا يجدي معه تمرير الإجابة
      # بأنبوب (yes |). فالحل من وجهين: ملف إعداد يمنع سؤال JDK من أصله،
      # و expect يحاكي طرفية حقيقية فيجيب عمّا يبقى.
      # ولا نحدّد androidSdkPath: فالمجلد الذي ننشئه يكون فارغًا فيرفضه.
      - name: إعداد بيئة Bubblewrap بلا أسئلة
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath": "%s"}\n' "$JAVA_HOME" > "$HOME/.bubblewrap/config.json"
          echo "محتوى إعداد Bubblewrap:"
          cat "$HOME/.bubblewrap/config.json"
          echo "JAVA_HOME = $JAVA_HOME"
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect

      # مفتاح التوقيع: إن ضُبط كأسرار في المستودع استُخدم، وإلا أُنشئ
      # جديدًا. احفظ المفتاح المرفوع بعد أول بناء: ففقدانه يمنع تحديث
      # التطبيق على المتجر (لا يقبل تحديثًا بتوقيع مختلف).
      - name: استعادة مفتاح التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'selahtone' }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "✓ استُستخدم المفتاح المحفوظ"
          else
            echo "⚠ لا مفتاح محفوظ — يُنشأ مفتاح جديد وتُرفع نسخته"
            # -dname يجيب عن كل أسئلة الاسم والمؤسسة والدولة مسبقًا، فلا يتوقف البناء
            keytool -genkeypair -v -keystore android.keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASSWORD" -keypass "$KS_PASSWORD" \
              -dname "CN=Selah Tone, OU=IT, O=Selah Tone, L=Cairo, ST=Cairo, C=EG"
          fi

      - name: تحديث الإصدار
        if: github.event_name == 'workflow_dispatch'
        run: |
          node -e "
            const fs = require('fs');
            const p = 'twa-manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            m.appVersionName = '${{ inputs.version_name }}' || m.appVersionName;
            m.appVersionCode = Number('${{ inputs.version_code }}' || m.appVersionCode);
            fs.writeFileSync(p, JSON.stringify(m, null, 2));
          "

      # يقرأ الـ manifest الحي من الموقع المنتشر، فيضمن تطابق الأيقونات والألوان
      - name: مطابقة الإعداد مع الموقع الحي
        run: bubblewrap update --manifest=https://selahtone-erp.onrender.com/manifest.webmanifest || echo "⚠ تعذّر تحديث الـ manifest من الموقع الحي — يُكمل بالإعداد المحفوظ"

      - name: بناء APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'selahtone' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'selahtone' }}
        run: |
          expect <<'EXPECT_SCRIPT'
          set timeout 1800
          log_user 1
          spawn bubblewrap build --skipJdkInstallation
          expect {
            -re {install the JDK} { send "n\r"; exp_continue }
            -re {[Jj][Dd][Kk]}    { send "n\r"; exp_continue }
            -re {Android SDK}     { send "y\r"; exp_continue }
            -re {[Ss][Dd][Kk]}    { send "y\r"; exp_continue }
            -re {[Ll]icense}      { send "y\r"; exp_continue }
            -re {assword}         { send "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"; exp_continue }
            -re {\(Y/n\)}         { send "y\r"; exp_continue }
            -re {\(y/n\)}         { send "y\r"; exp_continue }
            timeout         { puts "\nانتهى وقت الانتظار"; exit 1 }
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EXPECT_SCRIPT

      # البصمة مطلوبة لربط النطاق بالتطبيق (assetlinks.json)
      - name: بصمة SHA-256 — ضعها في ANDROID_SHA256 عند Render
        run: |
          echo "================ بصمة التوقيع ================"
          keytool -list -v -keystore android.keystore \
            -alias android \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'selahtone' }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'selahtone' }}" \
            | grep -i "SHA256" || echo "تعذّر استخراج البصمة"
          echo "============================================"

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: selahtone-apk
          path: app-release-signed.apk
          if-no-files-found: error

      - name: رفع مفتاح التوقيع (احتفظ به!)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: android.keystore
          if-no-files-found: warn
